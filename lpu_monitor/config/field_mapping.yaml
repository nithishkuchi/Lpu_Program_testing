# field_mapping.yaml
#
# Maps raw JSON keys from webapi.lpu.in responses to canonical, stable field
# names used everywhere else in the system (storage, diffing, reporting).
#
# STATUS: the `fee` section below is based on REAL confirmed responses for
# P132 (B.Tech CSE), P102-NNP (Diploma AI/ML), and P8G (D.Litt) -- not guesses.
#
# --- CONFIRMED RESPONSE-SHAPE RULES (from real test runs, not assumptions) ---
#
# 1. EMPTY ARRAY = "not applicable", not an error.
#    P8G (D.Litt, a Ph.D-tier programme) returned `[]`. The normalizer must
#    treat an empty array as "no fee data exists for this programme" -- log it
#    plainly, do NOT raise an error, and do NOT write any field_snapshots rows
#    for that programme's fee group (there's nothing to compare against later).
#
# 2. MULTI-ENTRY ARRAYS: COALESCE, DO NOT INDEX A FIXED ENTRY.
#    P132/P132-L/P132-HNF/P5K0-NNKA all returned fully-identical duplicate
#    entries. But P102-NNP returned two entries differing in exactly one field
#    (UniformFee): entry[0] = "4000 (One time)", entry[1] = null. This is a
#    duplicate-row-with-a-missing-value pattern, not two disagreeing real
#    numbers. The normalizer must therefore extract each field as:
#        first non-null value found, scanning entries in order
#    rather than always reading entries[0] -- otherwise a programme whose
#    entries[0] happens to be the incomplete copy would silently record a
#    missing fee as null instead of the real value. json_path values below are
#    written as bare field names (no "[0]." prefix) for exactly this reason --
#    the normalizer applies the coalesce rule to every field uniformly.
#
# 3. If coalescing finds a field where entries have DIFFERENT non-null values
#    (a genuine disagreement, not just "one is missing"), that's a real data
#    inconsistency worth flagging to LPU IT directly -- log it distinctly
#    (e.g. to api_health_log) rather than silently picking either value.

fee:
